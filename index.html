<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#16120e" />
    <!--
      Dark first paint, before the stylesheet or any JS arrives. Duki starts in
      night and the app switches to the reader's preference once it knows it
      (src/lib/theme.ts). Inline <style> is allowed by the production CSP;
      inline <script> is not, so the boot theme is static markup.
    -->
    <style>
      html { background-color: #1c1612; color: #ead9c4; color-scheme: dark; }
      html[data-theme="paper"] { background-color: #f4eadc; color: #1b1410; color-scheme: light; }
      body { margin: 0; }
    </style>
    <meta
      name="description"
      content="A library of Mandarin stories, colored by the words you know."
    />
    <meta property="og:title" content="Duki — Mandarin reading" />
    <meta
      property="og:description"
      content="A library of Mandarin stories, colored by the words you know."
    />
    <meta property="og:type" content="website" />
    <title>Duki — Mandarin reading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&family=Outfit:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
