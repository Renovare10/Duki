name: Deploy Duki (Cloudflare Pages + S3 rollback copy)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-duki
      cancel-in-progress: true

    env:
      PAGES_PROJECT: chadmurchison-duki
      S3_BUCKET: chadm-duki
      CF_DISTRIBUTION_ID: E2C30FHOL2BUQ5
      VITE_DUKI_API: https://j251m3eof8.execute-api.us-east-2.amazonaws.com
      VITE_COGNITO_DOMAIN: https://accounts.chadmurchison.com
      VITE_COGNITO_CLIENT_ID: 34crk50b2obng6cdgh2mhp029s
      VITE_COGNITO_USER_POOL_ID: us-east-2_y5IGDDBu4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm test
          npm run build

      # Live site: Cloudflare Pages (same hostname, so guest IndexedDB data and sign-in are unchanged).
      # dist-pages/ = dist/ + deploy/pages/_headers (CSP + security headers + cache rules), _redirects,
      # and assets/404.html. The S3 copy below still uses plain dist/.
      - name: Assemble Pages output
        run: ./scripts/build-pages.sh dist-pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-pages --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true

      # TODO(after Nov 8 2026): remove the AWS steps below (S3 sync + CloudFront invalidation) once the
      # 2-week Cloudflare rollback window is over; they only keep the CloudFront copy current for rollback.

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::376374282414:role/GitHubActions-Exigency-Deploy
          aws-region: us-east-2

      - name: Sync dist to S3
        run: |
          aws s3 sync dist/assets "s3://${S3_BUCKET}/assets" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://${S3_BUCKET}" --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public, max-age=3600"
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "public, max-age=60, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Deployed
        run: echo "Deployed https://duki.chadmurchison.com/ (Cloudflare Pages) + S3/CloudFront rollback copy"
